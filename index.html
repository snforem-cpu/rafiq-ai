  <script>

    /*
     * رفيق AI
     *
     * GitHub Pages
     *      ↓
     * Google Apps Script Web App
     *      ↓
     * Cloudflare Worker
     *      ↓
     * Gemini generateContent
     */

    const WORKER_URL =
      "https://script.google.com/macros/s/AKfycbx4pv1DfDc-g04Z2tttgV3D5XWxY6gaWrLoiMkE-FgrZXLdxV5yWp5GVdIVM5jIKEci/exec";


    /* =========================
       عناصر الواجهة
    ========================= */

    const sidebar =
      document.getElementById("sidebar");

    const overlay =
      document.getElementById("overlay");

    const openSidebar =
      document.getElementById("openSidebar");

    const closeSidebar =
      document.getElementById("closeSidebar");

    const newChat =
      document.getElementById("newChat");

    const topNewChat =
      document.getElementById("topNewChat");

    const chatInner =
      document.getElementById("chatInner");

    const chat =
      document.getElementById("chat");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const attachButton =
      document.getElementById("attachButton");


    /* =========================
       القائمة الجانبية
    ========================= */

    function openMenu() {
      sidebar.classList.add("open");
      overlay.classList.add("open");
    }

    function closeMenu() {
      sidebar.classList.remove("open");
      overlay.classList.remove("open");
    }

    openSidebar.addEventListener(
      "click",
      openMenu
    );

    closeSidebar.addEventListener(
      "click",
      closeMenu
    );

    overlay.addEventListener(
      "click",
      closeMenu
    );


    /* =========================
       شاشة البداية
    ========================= */

    function createWelcome() {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "welcome";

      wrapper.innerHTML = `
        <div class="welcome-icon">ر</div>

        <h1>مرحبًا، أنا رفيق</h1>

        <p>
          أنا رفيق، مساعدك الشخصي بالذكاء الاصطناعي.
          أخبرني بما تريد، وسأساعدك في التفكير، البحث، التحليل وإنجاز المهام.
        </p>

        <div class="suggestions">

          <button
            class="suggestion"
            data-prompt="ساعدني في التخطيط لمشروع جديد">
            💡 ساعدني في التخطيط لمشروع جديد
          </button>

          <button
            class="suggestion"
            data-prompt="اشرح لي موضوعًا بطريقة بسيطة">
            📚 اشرح لي موضوعًا بطريقة بسيطة
          </button>

          <button
            class="suggestion"
            data-prompt="حلل هذه الفكرة معي خطوة بخطوة">
            🔎 حلل هذه الفكرة معي
          </button>

          <button
            class="suggestion"
            data-prompt="ما الذي تستطيع مساعدتي فيه؟">
            ✨ ماذا تستطيع أن تفعل؟
          </button>

        </div>
      `;

      wrapper
        .querySelectorAll(".suggestion")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              messageInput.value =
                button.dataset.prompt;

              autoResize();

              messageInput.focus();

            }
          );

        });

      return wrapper;
    }


    /* =========================
       محادثة جديدة
    ========================= */

    function resetChat() {

      chatInner.innerHTML = "";

      chatInner.appendChild(
        createWelcome()
      );

      messageInput.value = "";

      messageInput.style.height =
        "auto";

      chat.scrollTop = 0;

      localStorage.removeItem(
        "rafiq_conversation_id"
      );

    }

    newChat.addEventListener(
      "click",
      () => {

        resetChat();

        closeMenu();

      }
    );

    topNewChat.addEventListener(
      "click",
      resetChat
    );


    /* =========================
       إضافة رسالة
    ========================= */

    function addMessage(
      role,
      text
    ) {

      const welcome =
        document.getElementById("welcome");

      if (
        welcome &&
        welcome.parentNode
      ) {
        welcome.remove();
      }

      const message =
        document.createElement("div");

      message.className =
        `message ${role}`;

      const avatar =
        document.createElement("div");

      avatar.className =
        "message-avatar";

      avatar.textContent =
        role === "assistant"
          ? "ر"
          : "أنت";

      const content =
        document.createElement("div");

      content.className =
        "message-content";

      content.textContent =
        text;

      message.appendChild(
        avatar
      );

      message.appendChild(
        content
      );

      chatInner.appendChild(
        message
      );

      requestAnimationFrame(
        () => {
          chat.scrollTop =
            chat.scrollHeight;
        }
      );

      return message;
    }


    /* =========================
       تكبير مربع الكتابة
    ========================= */

    function autoResize() {

      messageInput.style.height =
        "auto";

      messageInput.style.height =
        Math.min(
          messageInput.scrollHeight,
          150
        ) + "px";
    }

    messageInput.addEventListener(
      "input",
      autoResize
    );


    /* =========================
       المستخدم
    ========================= */

    function getUserId() {

      let userId =
        localStorage.getItem(
          "rafiq_user_id"
        );

      if (!userId) {

        userId =
          crypto.randomUUID();

        localStorage.setItem(
          "rafiq_user_id",
          userId
        );
      }

      return userId;
    }


    /* =========================
       إرسال الرسالة
    ========================= */

    async function sendMessage() {

      const text =
        messageInput.value.trim();

      if (!text) {
        return;
      }

      addMessage(
        "user",
        text
      );

      messageInput.value = "";

      messageInput.style.height =
        "auto";

      sendButton.disabled = true;

      const userId =
        getUserId();

      const conversationId =
        localStorage.getItem(
          "rafiq_conversation_id"
        ) || null;

      const loadingMessage =
        addMessage(
          "assistant",
          "جاري التفكير..."
        );

      const loadingContent =
        loadingMessage.querySelector(
          ".message-content"
        );

      try {

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  action:
                    "chat",

                  user_id:
                    userId,

                  conversation_id:
                    conversationId,

                  message:
                    text

                })
            }
          );


        let data = null;

        try {

          data =
            await response.json();

        } catch {

          throw new Error(
            "لم يتمكن رفيق من قراءة رد الخادم."
          );

        }


        if (
          !response.ok ||
          !data.ok
        ) {

          throw new Error(
            data?.error ||
            `خطأ من الخادم (${response.status})`
          );

        }


        if (
          data.conversation_id
        ) {

          localStorage.setItem(
            "rafiq_conversation_id",
            data.conversation_id
          );

        }


        loadingContent.textContent =
          data.reply ||
          "لم يصل رد من رفيق.";


      } catch (error) {

        console.error(
          "Rafiq connection error:",
          error
        );

        loadingContent.textContent =
          error?.message ||
          "حدث خطأ أثناء الاتصال برفيق.";


      } finally {

        sendButton.disabled =
          false;

        messageInput.focus();

      }

    }


    /* =========================
       Enter
    ========================= */

    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =========================
       زر الإرسال
    ========================= */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* =========================
       المرفقات
    ========================= */

    attachButton.addEventListener(
      "click",
      () => {

        alert(
          "رفع الملفات سيتم تفعيله عند ربط طبقة الملفات بالـBackend."
        );

      }
    );


    /* =========================
       القائمة
    ========================= */

    document
      .querySelectorAll(
        ".nav-button, .profile-button"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const section =
              button.dataset.section;

            if (section) {

              alert(
                "قسم " +
                section +
                " موجود في بنية رفيق وسيتم ربطه بالوظيفة الحقيقية في مرحلته."
              );

            }

            closeMenu();

          }
        );

      });


    /* =========================
       الاقتراحات
    ========================= */

    document
      .querySelectorAll(
        ".suggestion"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            messageInput.value =
              button.dataset.prompt;

            autoResize();

            messageInput.focus();

          }
        );

      });

  </script>

</body>
</html>
